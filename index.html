<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flow Curves Explorer — Complete</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.2/p5.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="themes.js"></script>
  <script src="spiro.js"></script>
</head>
<body>
  <button id="fullscreenToggle">Toggle Fullscreen Canvas</button>

  <div id="controls">
    <h2>Curve Types</h2>

    <div class="control-group">
      <label for="curveType">PRIMARY CURVE</label>
      <select id="curveType">
        <option value="hypotrochoid">Hypotrochoid</option>
        <option value="epitrochoid">Epitrochoid</option>
        <option value="rose">Rose Curve</option>
        <option value="lissajous">Lissajous</option>
        <option value="superformula">Superformula</option>
        <option hidden value="harmonograph">Harmonograph</option>
      </select>
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="dualCurveMode"> ENABLE DUAL CURVE MODE
      </label>
    </div>

    <div class="control-group">
      <label for="secondaryCurve">SECONDARY CURVE</label>
      <select id="secondaryCurve">
        <option value="hypotrochoid">Hypotrochoid</option>
        <option value="epitrochoid">Epitrochoid</option>
        <option value="rose">Rose Curve</option>
        <option value="lissajous">Lissajous</option>
        <option value="superformula">Superformula</option>
        <option hidden value="harmonograph">Harmonograph</option>
      </select>
    </div>

    <div class="control-group">
      <label for="dualModeType">DUAL MODE</label>
      <select id="dualModeType">
        <option value="blend">Blend Curves (Slow)</option>
        <option value="combine">Combine Points</option>
        <option value="alternate">Alternate Layers</option>
      </select>
    </div>

    <button id="shuffleTheme" style="background: #e35050;">Shuffle Theme</button>
    <button onclick="saveCanvas('spiro-capture', 'png')">Save Image</button>

    <h2>Geometry</h2>

    <div class="control-group">
      <label for="outerRadius">Outer Radius (R) <span id="outerRadius-value" class="value-display"></span></label>
      <input id="outerRadius" type="range" min="10" max="300" step="1" value="180">
    </div>

    <div class="control-group">
      <label for="innerRadius">Inner Radius (r) <span id="innerRadius-value" class="value-display"></span></label>
      <input id="innerRadius" type="range" min="10" max="250" step="1" value="80">
    </div>

    <div class="control-group">
      <label for="centerSize">Center Size (d) <span id="centerSize-value" class="value-display"></span></label>
      <input id="centerSize" type="range" min="0" max="200" step="1" value="60">
    </div>

    <div class="control-group">
      <label for="numPoints">Number of Points <span id="numPoints-value" class="value-display"></span></label>
      <input id="numPoints" type="range" min="1" max="30" step="1" value="12">
    </div>

    <div class="control-group">
      <label for="scale">Scale (Zoom) <span id="scale-value" class="value-display"></span></label>
      <input id="scale" type="range" min="0.1" max="2" step="0.01" value="1.0">
    </div>

    <h2>Layers & Offsets</h2>

    <div class="control-group">
      <label for="numLayers">Number of Layers <span id="numLayers-value" class="value-display"></span></label>
      <input id="numLayers" type="range" min="1" max="6" step="1" value="2">
    </div>

    <div class="control-group">
      <label for="layerOffsetMode">Layer Offset Mode</label>
      <select id="layerOffsetMode">
        <option value="none">None</option>
        <option value="radius">Radius</option>
        <option value="rotation">Rotation</option>
        <option value="phase">Phase</option>
      </select>
    </div>

    <div class="control-group">
      <label for="layerOffsetAmount">Offset Amount <span id="layerOffsetAmount-value" class="value-display"></span></label>
      <input id="layerOffsetAmount" type="range" min="0" max="1" step="0.01" value="0.06">
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="reverseLayers"> REVERSE ALTERNATE LAYERS
      </label>
    </div>

    <h2>Aesthetics</h2>

    <div class="control-group">
      <label for="animSpeed">Anim Speed <span id="animSpeed-value" class="value-display"></span></label>
      <input id="animSpeed" type="range" min="0" max="0.04" step="0.001" value="0.02">
    </div>

    <div class="control-group">
      <label for="trailLength">Trail Length <span id="trailLength-value" class="value-display"></span></label>
      <input id="trailLength" type="range" min="10" max="400" step="1" value="50">
    </div>

    <div class="control-group">
      <label for="lineWeight">Line Weight <span id="lineWeight-value" class="value-display"></span></label>
      <input id="lineWeight" type="range" min="0.1" max="6" step="0.1" value="1.6">
    </div>

    <div class="control-group">
      <label for="lineThinning">Line Thinning <span id="lineThinning-value" class="value-display"></span></label>
      <input id="lineThinning" type="range" min="0" max="1" step="0.01" value="0.7">
    </div>

    <div class="control-group">
      <label for="baseHue">Base Hue <span id="baseHue-value" class="value-display"></span></label>
      <input id="baseHue" type="range" min="0" max="360" step="1" value="260">
    </div>

    <div class="control-group">
      <label for="colorSpread">Color Spread <span id="colorSpread-value" class="value-display"></span></label>
      <input id="colorSpread" type="range" min="0" max="360" step="1" value="120">
    </div>

  </div>

  <div id="canvas-container">
    </div>

    <div class="control-group">
      <label for="colorSpread">Color Spread <span id="colorSpread-value" class="value-display"></span></label>

  </div>

  <div id="canvas-container"></div>

  <script src="themes.js"></script>
  <script src="spiro.js"></script>
</body>
</html>
